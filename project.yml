name: Fleet
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Fleet:
    type: application
    platform: macOS
    sources:
      - path: Fleet
    resources:
      - path: Fleet/Resources
    info:
      path: Fleet/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yafo.Fleet
        PRODUCT_NAME: Fleet
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Fleet:
    build:
      targets:
        Fleet: all
